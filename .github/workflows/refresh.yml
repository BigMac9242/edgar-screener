name: Refresh EDGAR data

# Runs on GitHub's servers, which can reach data.sec.gov.
# Sundays at 06:00 UTC, or whenever you press the button in the Actions tab.
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      year:
        description: "Fiscal year to screen"
        default: "2024"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull filings from SEC EDGAR
        env:
          # Set this in Settings > Secrets and variables > Actions.
          # The SEC requires a real contact address in the User-Agent header.
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          python screener.py \
            --year "${{ github.event.inputs.year || '2024' }}" \
            --min-revenue 1e9 \
            --out data.json \
            --js data.js \
            --top 25

      - name: Commit the new dataset
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js
          if git diff --staged --quiet; then
            echo "No change in the data - nothing to commit."
          else
            git commit -m "Refresh EDGAR data ($(date -u +%Y-%m-%d))"
            git push
          fi
